<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - KAY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo"><img src="IMG_5175.PNG" alt="KAY Logo" class="logo-image"></a>
            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="contacto.html" style="color: var(--color-primary); font-weight: bold;">Contacto</a>
            </nav>
            <div class="header-actions">
                <a href="https://www.instagram.com/kayperuviandesserts" target="_blank" class="social-icon" aria-label="Instagram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="about-page" style="min-height: 60vh; padding-top: 20px;">
        <!-- Contact Form Section -->
        <section class="contact-section">
            <div class="contact-container">
                <h2>Contáctanos</h2>
                <p>Déjanos tu mensaje y nos pondremos en contacto contigo.</p>
                <form id="contactForm" class="contact-form">
                    <input type="text" id="nameInput" placeholder="Tu nombre completo" required>
                    <input type="email" id="emailInput" placeholder="Tu correo electrónico (ej. @gmail.com)" required>
                    <textarea id="messageInput" rows="4" placeholder="¿En qué te podemos ayudar?" required></textarea>
                    <button type="submit" class="cta-button">Enviar Mensaje</button>
                </form>
                <p id="contactMsg" class="form-msg"></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <a href="index.html" class="logo"><img src="IMG_5175.PNG" alt="KAY Logo" class="logo-image" style="height: 60px;"></a>
            <div class="footer-social">
                <a href="https://www.instagram.com/kayperuviandesserts" target="_blank" class="social-icon" aria-label="Instagram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
            </div>
            <p>&copy; 2026 KAY. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Order Modal (Not strictly needed here but good to have) -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeOrderModal">&times;</span>
            <h2>Realizar Pedido</h2>
            <p>Por favor, déjanos tus datos para procesar el pedido del producto: <strong id="orderProductName"></strong></p>
            <form id="orderForm" class="contact-form" style="margin-top: 15px;">
                <input type="text" id="orderName" placeholder="Tu nombre completo" required>
                <input type="tel" id="orderPhone" placeholder="Tu teléfono (ej. 600123456)" required>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="orderQty" style="font-weight: bold; color: var(--color-dark);">Cantidad:</label>
                    <input type="number" id="orderQty" min="1" max="80" value="1" required style="width: 100px;">
                </div>
                <button type="submit" class="cta-button" id="submitOrderBtn">Enviar Pedido</button>
            </form>
            <p id="orderStatusMsg" class="form-msg"></p>
        </div>
    </div>

    <!-- WhatsApp Floating Button -->
    <a href="https://api.whatsapp.com/send?phone=000000000&text=Hola%20estoy%20interesado%20en%20los%20postres%20KAY" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
    </a>

    <script src="script.js?v=12"></script>
</body>
</html>
