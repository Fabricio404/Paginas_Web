<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - KAY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Questrial&family=Shrikhand&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo"><img src="IMG_5175.PNG" alt="KAY Logo" class="logo-image"></a>
            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html" style="color: var(--color-primary); font-weight: bold;">Catálogo</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="contacto.html">Contacto</a>
            </nav>
            <div class="header-actions">
                <a href="https://www.instagram.com/kayperuviandesserts" target="_blank" class="social-icon" aria-label="Instagram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="slideshow-section">
            <h2 class="slideshow-title">Nuestra Colección</h2>
            <div class="slideshow-container" id="autoSlideshow">
                <div class="slideshow-track" id="slideshowTrack">
                    <!-- Las imágenes se inyectan por JS -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <a href="index.html" class="logo"><img src="IMG_5175.PNG" alt="KAY Logo" class="logo-image" style="height: 60px;"></a>
            <div class="footer-social">
                <a href="https://www.instagram.com/kayperuviandesserts" target="_blank" class="social-icon" aria-label="Instagram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
            </div>
            <p>&copy; 2026 KAY. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeCartModal">&times;</span>
            <h2>Tu Cesta</h2>
            <div id="cartItemsContainer" class="cart-items">
                <p class="empty-cart-msg">Tu cesta está vacía.</p>
            </div>
            <div class="cart-footer">
                <button id="checkoutBtn" class="checkout-btn" disabled>Realizar Pedido</button>
                <button id="clearCartBtn" class="clear-cart-btn" style="display: none;">Vaciar Cesta</button>
            </div>
        </div>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeOrderModal">&times;</span>
            <h2>Datos de Envío</h2>
            <p>Por favor, déjanos tus datos para enviarle la lista al jefe por WhatsApp.</p>
            <form id="orderForm" class="contact-form" style="margin-top: 15px;">
                <input type="text" id="orderName" placeholder="Tu nombre completo" required>
                <input type="tel" id="orderPhone" placeholder="Tu teléfono (ej. 600123456)" required>
                <button type="submit" class="cta-button" id="submitOrderBtn">Enviar Pedido</button>
            </form>
            <p id="orderStatusMsg" class="form-msg"></p>
        </div>
    </div>

    <!-- WhatsApp Floating Button -->
    <a href="https://api.whatsapp.com/send?phone=000000000&text=Hola%20estoy%20interesado%20en%20los%20postres%20KAY" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
    </a>

    <script src="script.js?v=12"></script>
</body>
</html>
